<html lang="uz">

  <meta charset="UTF-8" />

  <title>Yangiliklar Portali</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #0b1120; color: #f8fafc; padding-bottom: 40px; }
    header { background: #111827; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #2563eb; }
    .brand { font-size: 18px; font-weight: bold; }
    .lang-bar, .cat-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn { padding: 7px 12px; border: 1px solid #475569; background: #1e293b; color: #fff; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #2563eb; border-color: #2563eb; }
    .cat-bar { background: #131c2e; padding: 12px 18px; justify-content: center; border-bottom: 1px solid #243656; }
    .cat-btn { padding: 7px 14px; border: 1px solid #3b82f6; background: #0b1324; color: #e2e8f0; border-radius: 18px; cursor: pointer; font-size: 13px; }
    .cat-btn.active { background: #2563eb; color: #fff; }
    .wrap { max-width: 1120px; margin: 20px auto; padding: 0 14px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .search-box { padding: 7px 12px; border-radius: 6px; border: 1px solid #475569; background: #111827; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #111827; border: 1px solid #26354d; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 170px; object-fit: cover; }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .meta { font-size: 12px; color: #60a5fa; }
    .info-box { background: #172554; border: 1px solid #3b82f6; padding: 7px 10px; border-radius: 6px; font-size: 12px; }
    .title { font-size: 16px; }
    .text { font-size: 14px; color: #cbd5e1; flex: 1; }
    .btn { align-self: flex-start; padding: 7px 13px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: 13px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-box { background: #111827; border: 1px solid #334155; border-radius: 12px; max-width: 680px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 18px; }
    .modal-box img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; margin: 10px 0; }
    .close { float: right; padding: 5px 10px; background: #334155; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>

      <button type="button" class="lang-btn" id="l-ru" onclick="setLang('ru')">Русский</button>
    </div>
  </header>

  <nav class="cat-bar" id="cats"></nav>

  <main class="wrap">
    <div class="top-row">

    </div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
