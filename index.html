<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0b1120; color: #f8fafc; padding-bottom: 50px; }

    header {
      background: #111827;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid #2563eb;
    }
    .brand { font-size: 19px; font-weight: bold; }

    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 8px 14px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-btn.active { background: #2563eb; border-color: #2563eb; }

    .cat-bar {
      background: #131c2e;
      padding: 13px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      border-bottom: 1px solid #23324d;
    }
    .cat-btn {
      padding: 8px 14px;
      border: 1px solid #3b82f6;
      background: #0b1324;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .container { max-width: 1160px; margin: 22px auto; padding: 0 16px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-title { font-size: 19px; font-weight: bold; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search-input {
      background: #111827;
      color: #f8fafc;
      border: 1px solid #374151;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      min-width: 210px;
    }
    .count-badge { font-size: 13px; color: #94a3b8; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }
    .card {
      background: #111827;
      border: 1px solid #26354d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      background: #1e293b;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-meta { font-size: 12px; color: #60a5fa; font-weight: 600; }
    .match-box {
      background: #172554;
      border: 1px solid #3b82f6;
      color: #dbeafe;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
    .card-title { font-size: 17px; line-height: 1.38; color: #f8fafc; }
    .card-text { font-size: 14px; line-height: 1.55; color: #cbd5e1; flex: 1; }
    .read-btn {
      align-self: flex-start;
      margin-top: 6px;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .read-btn:hover { background: #2563eb; }

    .reader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .reader-overlay.open { display: flex; }
    .reader-box {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      max-width: 700px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
    }
    .reader-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .close-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .reader-img {
      width: 100%;
      max-height: 270px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .reader-title { font-size: 21px; line-height: 1.35; margin-bottom: 12px; color: #f8fafc; }
    .reader-full { font-size: 15px; line-height: 1.7; color: #e2e8f0; white-space: pre-line; }
  </style>
</head>
<body>

  <header>
    <div class="brand" id="brand">YANGILIKLAR SAYTI</div>
    <div class="lang-bar">
      <button type="button" class="lang-btn active" id="l-uz" onclick="setLanguage('uz')">O'zbek</button>
      <button type="button" class="lang-btn" id="l-en" onclick="setLanguage('en')">English</button>
      <button type="button" class="lang-btn" id="l-ru" onclick="setLanguage('ru')">Русский</button>
    </div>
  </header>

  <nav class="cat-bar" id="cat-bar"></nav>

  <main class="container">
    <div class="toolbar">
      <h2 class="section-title" id="sec-title">Sport</h2>
      <div class="filter-row">
        <input type="search" class="search-input" id="search-input" oninput="renderCards()" placeholder="Qidirish..." />
        <span class="count-badge" id="count-badge"></span>
      </div>
    </div>
    <div class="news-grid" id="news-grid"></div>
  </main>

  <div class="reader-overlay" id="reader-overlay" onclick="if(event.target.id==='reader-overlay')closeReader()">
    <div class="reader-box">
      <div class="reader-top">
        <span class="card-meta" id="reader-meta"></span>
        <button type="button" class="close-btn" id="close-btn" onclick="closeReader()">Yopish</button>
      </div>
      <img id="reader-img" class="reader-img" src="" alt="" />
      <h2 id="reader-title" class="reader-title"></h2>
      <div id="reader-full" class="reader-full"></div>
    </div>
  </div>
