<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Yangiliklar Portali</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0b1120; color: #f8fafc; padding-bottom: 50px; }

    header {
      background: #111827;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid #2563eb;
    }
    .brand { font-size: 20px; font-weight: bold; }

    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 8px 14px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-btn.active { background: #2563eb; border-color: #2563eb; }

    .cat-bar {
      background: #131c2e;
      padding: 13px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #23324d;
    }
    .cat-btn {
      padding: 8px 16px;
      border: 1px solid #3b82f6;
      background: #0b1324;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .container { max-width: 1160px; margin: 22px auto; padding: 0 16px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-title { font-size: 19px; font-weight: bold; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .source-select {
      background: #111827;
      color: #f8fafc;
      border: 1px solid #374151;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .count-badge { font-size: 13px; color: #94a3b8; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .card {
      background: #111827;
      border: 1px solid #26354d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #090e1a;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #60a5fa;
      font-weight: 600;
    }
    .sport-tag {
      background: #1e293b;
      color: #e2e8f0;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .card-title { font-size: 17px; line-height: 1.38; color: #f8fafc; }
    .card-text { font-size: 14px; line-height: 1.55; color: #cbd5e1; flex: 1; }
    .card-link {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-top: 4px;
    }
    .card-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="brand" id="brand-name">GLOBAL YANGILIKLAR PORTALI</div>
    <div class="lang-bar">
      <button type="button" class="lang-btn active" id="l-uz" onclick="setLang('uz')">O'zbek</button>
      <button type="button" class="lang-btn" id="l-en" onclick="setLang('en')">English</button>
      <button type="button" class="lang-btn" id="l-ru" onclick="setLang('ru')">Русский</button>
    </div>
  </header>

  <nav class="cat-bar" id="cat-bar"></nav>

  <main class="container">
    <div class="toolbar">
      <h2 class="section-title" id="section-title">Sport</h2>
      <div class="filter-row">
        <select class="source-select" id="source-select" onchange="renderFilteredCards()"></select>
        <span class="count-badge" id="count-badge"></span>
      </div>
    </div>

    <div class="news-grid" id="news-grid"></div>
  </main>
