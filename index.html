<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangiliklar Portali — Barcha bo'limlar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 44px; }

    header {
      background: #1e293b;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid #2563eb;
    }
    .brand { font-size: 18px; font-weight: bold; }
    .search-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      min-width: 220px;
    }

    .cats {
      background: #172033;
      padding: 12px 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #26354d;
    }
    .cat-btn {
      padding: 7px 14px;
      border-radius: 18px;
      border: 1px solid #3b82f6;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .wrap { max-width: 1120px; margin: 20px auto; padding: 0 14px; }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      background: #0f172a;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .meta { font-size: 12px; color: #93c5fd; font-weight: 600; }
    .tv-box {
      background: #172554;
      border: 1px solid #3b82f6;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.5;
      color: #dbeafe;
    }
    .card h3 { font-size: 16px; line-height: 1.38; }
    .card p { font-size: 14px; color: #cbd5e1; line-height: 1.5; flex: 1; }
    .btn {
      align-self: flex-start;
      padding: 7px 13px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn:hover { background: #3b82f6; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 50;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      max-width: 660px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .close-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #64748b;
      background: #0f172a;
      color: #fff;
      cursor: pointer;
    }
    .modal-img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">YANGILIKLAR PORTALI</div>
    <input type="search" class="search-input" id="q" oninput="render()" placeholder="Barcha bo'limlardan izlash..." />
  </header>

  <nav class="cats" id="cats"></nav>

    <div class="grid" id="grid"></div>

  <div class="modal" id="modal" onclick="if(event.target.id==='modal')closeM()">

      <div class="modal-top">
        <span class="meta" id="m-meta"></span>
        <button type="button" class="close-btn" onclick="closeM()">Yopish</button>
      </div>
      <img id="m-img" class="modal-img" src="" alt="" />
      <h3 id="m-title" style="margin-bottom:10px; font-size:19px;"></h3>
      <p id="m-body" style="line-height:1.65; color:#e2e8f0; white-space:pre-line;"></p>
