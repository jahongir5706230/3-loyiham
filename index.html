<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Yangiliklar Portali</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0b1120; color: #f8fafc; padding-bottom: 50px; }

    header {
      background: #111827;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid #2563eb;
    }
    .brand { font-size: 20px; font-weight: bold; }

    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 8px 14px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-btn.active { background: #2563eb; border-color: #2563eb; }

    .cat-bar {
      background: #131c2e;
      padding: 13px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #23324d;
    }
    .cat-btn {
      padding: 8px 16px;
      border: 1px solid #3b82f6;
      background: #0b1324;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .container { max-width: 1160px; margin: 22px auto; padding: 0 16px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-title { font-size: 19px; font-weight: bold; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .source-select {
      background: #111827;
      color: #f8fafc;
      border: 1px solid #374151;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .count-badge { font-size: 13px; color: #94a3b8; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .card {
      background: #111827;
      border: 1px solid #26354d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #1e293b;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #60a5fa;
      font-weight: 600;
    }
    .sport-tag {
      background: #1e293b;
      color: #e2e8f0;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .card-title { font-size: 17px; line-height: 1.38; color: #f8fafc; }
    .card-text { font-size: 14px; line-height: 1.55; color: #cbd5e1; flex: 1; }
    .card-link {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-top: 4px;
    }
    .card-link:hover { text-decoration: underline; }
  </style>
</head>

    let currentLang = "uz";
    let currentCat = "sport";
    let currentStories = [];

    function setLang(lang) {
      currentLang = lang;
      currentCat = "sport";

      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("l-" + lang).classList.add("active");
      document.getElementById("brand-name").textContent = PORTAL[lang].brand;

      renderCategories();
      loadCategoryStories();
    }

    function renderCategories() {
      const bar = document.getElementById("cat-bar");
      bar.innerHTML = "";
      const cats = PORTAL[currentLang].categories;

      Object.keys(cats).forEach(key => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (key === currentCat ? " active" : "");
        btn.textContent = cats[key];
        btn.onclick = () => {
          currentCat = key;
          renderCategories();
          loadCategoryStories();
        };
        bar.appendChild(btn);
      });
    }

    function loadCategoryStories() {
      const pack = PORTAL[currentLang];
      document.getElementById("section-title").textContent = pack.categories[currentCat];
      currentStories = [...(pack.items[currentCat] || [])];
      populateSourceFilter();
      renderFilteredCards();
    }

    function populateSourceFilter() {
      const select = document.getElementById("source-select");
      const pack = PORTAL[currentLang];
      const sources = [...new Set(currentStories.map(item => item.source))];

      select.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "ALL";
      allOpt.textContent = pack.allSources;
      select.appendChild(allOpt);

      sources.forEach(src => {
        const opt = document.createElement("option");
        opt.value = src;
        opt.textContent = src;
        select.appendChild(opt);
      });
    }

    function renderFilteredCards() {
      const pack = PORTAL[currentLang];
      const selectedSource = document.getElementById("source-select").value;
      const filtered = selectedSource === "ALL"
        ? currentStories
        : currentStories.filter(item => item.source === selectedSource);

      document.getElementById("count-badge").textContent = `${filtered.length} ${pack.countLabel}`;

      const grid = document.getElementById("news-grid");
      grid.innerHTML = "";

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}" />
          <div class="card-body">
            <div class="card-top">
              <span>${item.source}</span>
              <span class="sport-tag">${item.subtopic || ""}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-text">${item.text}</p>
            <a class="card-link" href="${item.url}" target="_blank" rel="noopener noreferrer">${pack.readMore}</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    setLang("uz");
