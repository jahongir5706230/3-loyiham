
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UZ NEWS - Yangiliklar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    color: #222;
}

header {
    background: #102b50;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 32px;
}

header p {
    margin-top: 8px;
}

nav {
    background: #174477;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    padding: 12px;
    gap: 10px;
}

nav button {
    background: transparent;
    border: none;
    color: white;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
}

nav button:hover,
nav button.active {
    background: #f0a500;
    color: #111;
}

.search {
    text-align: center;
    padding: 25px;
}

.search input {
    width: 80%;
    max-width: 500px;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.section-title {
    margin-bottom: 20px;
    color: #102b50;
}

.news-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 22px;
}

.news-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000015;
    transition: 0.3s;
}

.news-card:hover {
    transform: translateY(-5px);
}

.news-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.news-content {
    padding: 17px;
}

.news-content h3 {
    color: #12345a;
    margin-bottom: 10px;
}

.news-content p {
    color: #555;
    line-height: 1.5;
}

.news-content span {
    display: inline-block;
    margin-top: 12px;
    color: #e69b00;
    font-size: 13px;
    font-weight: bold;
}

footer {
    background: #102b50;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}

@media(max-width:600px) {
    header h1 {
        font-size: 25px;
    }

    nav button {
        font-size: 14px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>UZ NEWS</h1>
    <p>Eng so'nggi va muhim yangiliklar</p>
</header>

<nav id="menu">
    <button class="active" onclick="filterNews('Barchasi',this)">Barchasi</button>
    <button onclick="filterNews('Ta’lim',this)">Ta'lim</button>
    <button onclick="filterNews('Sport',this)">Sport</button>
    <button onclick="filterNews('Dunyo',this)">Dunyo</button>
    <button onclick="filterNews('O‘zbekiston',this)">O'zbekiston</button>
    <button onclick="filterNews('Texnologiya',this)">Texnologiya</button>
</nav>

<div class="search">
    <input type="text" id="search"
    placeholder="Yangiliklarni qidirish..."
    oninput="searchNews()">
</div>

<div class="container">
    <h2 class="section-title" id="title">
        So'nggi yangiliklar
    </h2>

    <div class="news-container" id="news"></div>
</div>

<footer>
    <h3>UZ NEWS</h3>
    <p>© 2026 Barcha huquqlar himoyalangan</p>
</footer>

<script>

const newsData = [

{
category:"Ta’lim",
title:"Ta'lim sohasida yangi imkoniyatlar",
description:"O'quvchilar va talabalar uchun yangi ta'lim dasturlari taqdim etilmoqda.",
image:"https://images.unsplash.com/photo-1503676260728-1c00da094a0b"
},

{
category:"Sport",
title:"Futbol olamidagi so'nggi yangiliklar",
description:"Dunyo futbolida muhim uchrashuvlar va yangi natijalar.",
image:"https://images.unsplash.com/photo-1522778119026-d647f0596c20"
},

{
category:"Dunyo",
title:"Dunyoda muhim voqealar",
description:"Xalqaro maydonda yuz berayotgan muhim voqealar haqida.",
image:"https://images.unsplash.com/photo-1529107386315-e1a2ed48a620"
},

{
category:"O‘zbekiston",
title:"O'zbekistonda yangi loyihalar",
description:"Mamlakatimizda amalga oshirilayotgan yangi loyihalar.",
image:"https://images.unsplash.com/photo-1512453979798-5ea266f8880c"
},

{
category:"Texnologiya",
title:"Sun'iy intellekt rivojlanmoqda",
description:"Zamonaviy texnologiyalar hayotimizga yangi imkoniyatlar olib kelmoqda.",
image:"https://images.unsplash.com/photo-1677442136019-21780ecad995"
},

{
category:"Ta’lim",
title:"Universitetlarda yangi imkoniyatlar",
description:"Talabalar uchun zamonaviy ta'lim va ilmiy izlanish imkoniyatlari.",
image:"https://images.unsplash.com/photo-1523050854058-8df90110c9f1"
},

{
category:"Sport",
title:"Sport musobaqalariga tayyorgarlik",
description:"Sportchilar xalqaro musobaqalarga tayyorgarlik ko'rmoqda.",
image:"https://images.unsplash.com/photo-1461896836934-ffe607ba8211"
},

{
category:"Texnologiya",
title:"Yangi gadjetlar va innovatsiyalar",
description:"Texnologiya olamidagi yangi qurilmalar va kashfiyotlar.",
image:"https://images.unsplash.com/photo-1519389950473-47ba0277781c"
}

];

let currentCategory = "Barchasi";

function showNews(data) {

    const container = document.getElementById("news");

    container.innerHTML = "";

    if(data.length === 0) {
        container.innerHTML = "<p>Yangilik topilmadi.</p>";
        return;
    }

    data.forEach(item => {

        container.innerHTML += `
            <div class="news-card">
                <img src="${item.image}?auto=format&fit=crop&w=700&q=80"
                     alt="${item.title}"
                     onerror="this.src='https://placehold.co/600x400?text=UZ+NEWS'">

                <div class="news-content">
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <span>${item.category}</span>
                </div>
            </div>
        `;

    });

}

function filterNews(category, button) {

    currentCategory = category;

    document.querySelectorAll("nav button").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    document.getElementById("title").textContent =
        category === "Barchasi" ? "So'nggi yangiliklar" :
        category + " yangiliklari";

    searchNews();

}

function searchNews() {

    const value = document.getElementById("search")
        .value.toLowerCase();

    let filtered = newsData.filter(item => {

        const categoryMatch =
            currentCategory === "Barchasi" ||
            item.category === currentCategory;

        const searchMatch =
            item.title.toLowerCase().includes(value) ||
            item.description.toLowerCase().includes(value);

        return categoryMatch && searchMatch;

    });

    showNews(filtered);

}

showNews(newsData);

</script>

</body>
</html>
