<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangiliklar Portali</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 50px; }

    header {
      background: #1e293b;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid #334155;
    }
    .site-title { font-size: 20px; font-weight: bold; }

    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 8px 14px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-btn.active { background: #2563eb; border-color: #2563eb; }

    .cat-bar {
      background: #172033;
      padding: 14px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #2b3a55;
    }
    .cat-btn {
      padding: 9px 18px;
      border: 1px solid #3b82f6;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #ffffff; }

    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .section-title { font-size: 18px; font-weight: bold; }
    .source-info { font-size: 13px; color: #94a3b8; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #0f172a;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .card-meta {
      font-size: 12px;
      color: #60a5fa;
      font-weight: 600;
    }
    .card-title { font-size: 17px; color: #f8fafc; line-height: 1.4; }
    .card-text { font-size: 14px; color: #cbd5e1; line-height: 1.55; flex: 1; }
    .card-link {
      display: inline-block;
      margin-top: 6px;
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .card-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="site-title" id="site-title">YANGILIKLAR PORTALI</div>
    <div class="lang-bar">
      <button type="button" class="lang-btn active" id="btn-uz" onclick="setLang('uz')">O'zbek</button>
      <button type="button" class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
      <button type="button" class="lang-btn" id="btn-ru" onclick="setLang('ru')">Русский</button>
    </div>
  </header>

  <nav class="cat-bar" id="cat-bar"></nav>

  <main class="container">
    <div class="section-head">
      <h2 class="section-title" id="section-title">Yangiliklar</h2>
      <span class="source-info" id="source-info"></span>
    </div>
    <div class="news-grid" id="news-grid"></div>
  </main>

          ],

            {

              text: "Исследователи представили свежие данные о космических объектах и технологиях.",

          ]
        }
      }
    };

    let currentLang = "uz";
    let currentCat = "sport";

    function setLang(lang) {
      currentLang = lang;
      currentCat = "sport";

      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("btn-" + lang).classList.add("active");

      document.getElementById("site-title").textContent = PORTAL_DATA[lang].siteTitle;
      document.getElementById("source-info").textContent = PORTAL_DATA[lang].sourceInfo;

      renderCategories();
      loadNewsCards();
    }

    function renderCategories() {
      const bar = document.getElementById("cat-bar");
      bar.innerHTML = "";
      const cats = PORTAL_DATA[currentLang].categories;

      Object.keys(cats).forEach(key => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (key === currentCat ? " active" : "");
        btn.textContent = cats[key];
        btn.onclick = () => {
          currentCat = key;
          renderCategories();
          loadNewsCards();
        };
        bar.appendChild(btn);
      });
    }

    async function loadNewsCards() {
      const langPack = PORTAL_DATA[currentLang];
      document.getElementById("section-title").textContent = langPack.categories[currentCat];

      const rssUrl = langPack.rssFeeds[currentCat];
      let cards = langPack.items[currentCat] || [];

      // Agar RSS URL ko'rsatilgan bo'lsa, rss2json orqali yangi maqolalarni tortib ko'radi
      if (rssUrl) {
        try {
          const apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);
          const res = await fetch(apiUrl);
          if (res.ok) {
            const json = await res.json();
            if (Array.isArray(json.items) && json.items.length > 0) {
              cards = json.items.slice(0, 6).map(entry => ({
                source: json.feed?.title || "RSS Manba",
                title: entry.title || "",
                text: (entry.description || "").replace(/<[^>]*>/g, "").slice(0, 180) + "...",
                img: entry.enclosure?.link || entry.thumbnail || cards[0]?.img || "",
                url: entry.link || "#"
              }));
            }
          }
        } catch (err) {
          // Tarmoq yoki RSS xatosida tayyor manba kartochkalari ko'rsatiladi
        }
      }

      const grid = document.getElementById("news-grid");
      grid.innerHTML = "";

      cards.forEach(item => {
        const article = document.createElement("article");
        article.className = "card";
        article.innerHTML = `
          <img src="${item.img}" alt="${item.title}" />
          <div class="card-body">
            <div class="card-meta">${item.source}</div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-text">${item.text}</p>
            <a class="card-link" href="${item.url}" target="_blank" rel="noopener noreferrer">${langPack.readMore}</a>
          </div>
        `;
        grid.appendChild(article);
      });
    }

    setLang("uz");
  </script>
</body>
</html>
