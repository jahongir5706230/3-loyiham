<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global AI News Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 50px; }

    .topbar {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 3px solid #ef4444;
    }
    .brand { font-size: 20px; font-weight: bold; }
    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      padding: 8px 14px;
      border: 1px solid #64748b;
      background: #0f172a;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .lang-btn.active { background: #ef4444; border-color: #ef4444; }

    .cat-bar {
      background: #172033;
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      border-bottom: 1px solid #334155;
    }
    .cat-btn {
      padding: 9px 18px;
      border: 1px solid #3b82f6;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

    .studio {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      align-items: center;
      margin-bottom: 25px;
    }
    @media (max-width: 720px) {
      .studio { grid-template-columns: 1fr; text-align: center; }
    }

    .anchor-card {
      background: #0f172a;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
    .anchor-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
      margin-bottom: 10px;
    }
    .speaking .anchor-img {
      border-color: #ef4444;
      box-shadow: 0 0 18px #ef4444;
    }
    .status-text { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    .news-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #0f172a;
    }
    .news-title { font-size: 20px; color: #93c5fd; margin-bottom: 8px; }
    .news-body { font-size: 15px; color: #e2e8f0; margin-bottom: 14px; line-height: 1.5; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .play-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .stop-btn {
      background: #475569;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .section-heading { font-size: 18px; margin-bottom: 12px; color: #f8fafc; }
    .news-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .news-item-btn {
      text-align: left;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      color: #f8fafc;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .news-item-btn:hover, .news-item-btn.selected {
      border-color: #3b82f6;
      background: #24344d;
    }
    .news-item-btn img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 6px;
    }
    .news-item-title { font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">📺 AI YANGILIKLAR STUDIYASI</div>
    <div class="lang-bar">
      <button type="button" class="lang-btn active" id="lang-uz" onclick="changeLang('uz')">O'zbek</button>
      <button type="button" class="lang-btn" id="lang-en" onclick="changeLang('en')">English</button>
      <button type="button" class="lang-btn" id="lang-ru" onclick="changeLang('ru')">Русский</button>
    </div>
  </header>

  <nav class="cat-bar" id="cat-bar"></nav>

  <main class="container">
    <section class="studio">
      <div class="anchor-card" id="anchor-card">
        <img
          src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80"
          alt="Boshlovchi"
          class="anchor-img"
        />
        <div id="anchor-name" style="font-weight:bold;">Madina</div>
        <div class="status-text" id="status-text">Efirga tayyor</div>
      </div>

      <div>
        <img id="active-img" class="news-img" src="" alt="Yangilik rasmi" />
        <h2 class="news-title" id="active-title"></h2>
        <p class="news-body" id="active-body"></p>
        <div class="btn-row">
          <button type="button" class="play-btn" id="play-btn" onclick="readCurrentNews()">🔊 O'qib berish</button>
          <button type="button" class="stop-btn" id="stop-btn" onclick="stopReading()">⏹ To'xtatish</button>
        </div>
      </div>
    </section>

    <h3 class="section-heading" id="list-heading">Bo'limdagi yangiliklar:</h3>
    <div class="news-selector" id="news-selector"></div>
  </main>

  <script>
    const DATA = {
      uz: {
        langCode: "uz-UZ",
        anchor: "Madina (Studiya boshlovchisi)",
        ready: "Efirga tayyor",
        speaking: "🔴 Boshlovchi o'qimoqda...",
        playLabel: "🔊 O'qib berish",
        stopLabel: "⏹ To'xtatish",
        listHeading: "Bo'limdagi yangiliklar (tanlash uchun bosing):",
        categories: {
          sport: "Sport",
          education: "Ta'lim",
          world: "Dunyo",
          other: "Boshqa yangiliklar"
        },
        news: {
          sport: [
            {
              title: "Terma jamoamiz muhim uchrashuvda g'alaba qozondi",
              body: "Assalomu alaykum! Sport yangiliklari efirda. Milliy terma jamoamiz keskin bellashuvda g'alabaga erishib, muxlislarni quvontirdi.",
              img: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=700&q=80"
            },
            {
              title: "Yengil atletika bo'yicha yoshlar musobaqasi o'tkazildi",
              body: "Musobaqada yuzlab yosh sportchilar yugurish va sakrash turlari bo'yicha o'z kuchlarini sinovdan o'tkazdilar.",
              img: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=700&q=80"
            }
          ],
          education: [
            {
              title: "Dasturlash va sun'iy intellekt bo'yicha bepul kurslar boshlandi",
              body: "Ta'lim yangiliklari: Yoshlar uchun zamonaviy IT ko'nikmalarini o'rgatuvchi yangi o'quv dasturi ishga tushirildi.",
              img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=700&q=80"
            },
            {
              title: "Talabalar uchun xalqaro almashinuv dasturi e'lon qilindi",
              body: "Oliy o'quv yurti talabalari xorijiy universitetlarda bir semestr tahsil olish imkoniyatiga ega bo'ladilar.",
              img: "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=700&q=80"
            }
          ],
          world: [
            {
              title: "Yashil energiya va iqlim o'zgarishiga bag'ishlangan anjuman",
              body: "Dunyo yangiliklari: Mutaxassislar quyosh va shamol elektr stansiyalarini ko'paytirish bo'yicha yangi rejalarni muhokama qildilar.",
              img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=700&q=80"
            }
          ],
          other: [
            {
              title: "Koinot teleskopi yangi galaktika suratini yubordi",
              body: "Boshqa yangiliklar: Ilmiy markaz yangi olingan kosmik tasvirlarni jamoatchilikka taqdim etdi.",
              img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=700&q=80"
            }
          ]
        }
      },
      en: {
        langCode: "en-US",
        anchor: "Sarah (Studio Anchor)",
        ready: "Ready for broadcast",
        speaking: "🔴 Anchor is reading...",
        playLabel: "🔊 Read Aloud",
        stopLabel: "⏹ Stop",
        listHeading: "News in this category (click a button to read):",
        categories: {
          sport: "Sport",
          education: "Education",
          world: "World",
          other: "Other News"
        },
        news: {
          sport: [
            {
              title: "National team wins a thrilling match",
              body: "Welcome to Sport News! Our national squad secured an exciting victory in front of a packed stadium.",
              img: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=700&q=80"
            }
          ],
          education: [
            {
              title: "New AI and coding scholarships for students",
              body: "In Education news: Universities are expanding grants for students learning artificial intelligence and software engineering.",
              img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=700&q=80"
            }
          ],
          world: [
            {
              title: "Global summit focuses on renewable energy",
              body: "World News: Leaders met to discuss clean energy grids and sustainable global transport.",
              img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=700&q=80"
            }
          ],
          other: [
            {
              title: "Space observatory shares deep-space images",
              body: "Other News: Astronomers released fresh high-resolution images of distant star clusters.",
              img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=700&q=80"
            }
          ]
        }
      },
      ru: {
        langCode: "ru-RU",
        anchor: "Анна (Ведущая студии)",
        ready: "Готова к эфиру",
        speaking: "🔴 Ведущая читает...",
        playLabel: "🔊 Озвучить",
        stopLabel: "⏹ Стоп",
        listHeading: "Новости раздела (нажмите на карточку):",
        categories: {
          sport: "Спорт",
          education: "Образование",
          world: "Мир",
          other: "Другие новости"
        },
        news: {
          sport: [
            {
              title: "Команда одержала победу в важном матче",
              body: "В эфире новости спорта! Команда уверенно провела встречу и порадовала болельщиков.",
              img: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=700&q=80"
            }
          ],
          education: [
            {
              title: "Запущены новые программы обучения ИИ",
              body: "Новости образования: Студентам доступны новые курсы по программированию и анализу данных.",
              img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=700&q=80"
            }
          ],
          world: [
            {
              title: "Международная встреча по зеленой энергетике",
              body: "Мировые новости: Участники обсудили развитие возобновляемых источников энергии.",
              img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=700&q=80"
            }
          ],
          other: [
            {
              title: "Новые снимки далекого космоса",
              body: "Другие новости: Астрономы опубликовали свежие изображения звездных скоплений.",
              img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=700&q=80"
            }
          ]
        }
      }
    };

    let currentLang = "uz";
    let currentCat = "sport";
    let currentIdx = 0;

    function changeLang(lang) {
      stopReading();
      currentLang = lang;
      currentCat = "sport";
      currentIdx = 0;

      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("lang-" + lang).classList.add("active");

      renderCategories();
      renderNewsList();
      showNews(0);
    }

    function renderCategories() {
      const bar = document.getElementById("cat-bar");
      bar.innerHTML = "";
      const cats = DATA[currentLang].categories;

      Object.keys(cats).forEach(key => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (key === currentCat ? " active" : "");
        btn.textContent = cats[key];
        btn.onclick = () => {
          stopReading();
          currentCat = key;
          currentIdx = 0;
          renderCategories();
          renderNewsList();
          showNews(0);
        };
        bar.appendChild(btn);
      });
    }

    function renderNewsList() {
      const box = document.getElementById("news-selector");
      box.innerHTML = "";
      const items = DATA[currentLang].news[currentCat] || [];

      items.forEach((item, idx) => {
        const cardBtn = document.createElement("button");
        cardBtn.type = "button";
        cardBtn.className = "news-item-btn" + (idx === currentIdx ? " selected" : "");
        cardBtn.innerHTML = `
          <img src="${item.img}" alt="${item.title}" />
          <span class="news-item-title">${item.title}</span>
        `;
        cardBtn.onclick = () => {
          showNews(idx);
          readCurrentNews();
        };
        box.appendChild(cardBtn);
      });
    }

    function showNews(idx) {
      currentIdx = idx;
      const langPack = DATA[currentLang];
      const items = langPack.news[currentCat] || [];
      const item = items[idx] || { title: "", body: "", img: "" };

      document.getElementById("anchor-name").textContent = langPack.anchor;
      document.getElementById("status-text").textContent = langPack.ready;
      document.getElementById("play-btn").textContent = langPack.playLabel;
      document.getElementById("stop-btn").textContent = langPack.stopLabel;
      document.getElementById("list-heading").textContent = langPack.listHeading;

      document.getElementById("active-img").src = item.img;
      document.getElementById("active-title").textContent = item.title;
      document.getElementById("active-body").textContent = item.body;

      renderNewsList();
    }

    function readCurrentNews() {
      stopReading();
      const langPack = DATA[currentLang];
      const items = langPack.news[currentCat] || [];
      const item = items[currentIdx];
      if (!item || !("speechSynthesis" in window)) return;

      const utter = new SpeechSynthesisUtterance(item.title + ". " + item.body);
      utter.lang = langPack.langCode;

      const card = document.getElementById("anchor-card");
      const status = document.getElementById("status-text");

      utter.onstart = () => {
        card.classList.add("speaking");
        status.textContent = langPack.speaking;
      };
      utter.onend = () => {
        card.classList.remove("speaking");
        status.textContent = langPack.ready;
      };
      utter.onerror = () => {
        card.classList.remove("speaking");
        status.textContent = langPack.ready;
      };

      window.speechSynthesis.speak(utter);
    }

    function stopReading() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById("anchor-card").classList.remove("speaking");
      document.getElementById("status-text").textContent = DATA[currentLang].ready;
    }

    changeLang("uz");
  </script>
</body>
</html>
