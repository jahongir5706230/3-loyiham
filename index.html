<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Studiya — Yangiliklar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #070c16; color: #f8fafc; padding-bottom: 45px; }

    header {
      background: #0f172a;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 3px solid #ef4444;
    }
    .brand { font-size: 20px; font-weight: bold; }
    .lang-btns { display: flex; gap: 8px; }
    .lang-btn {
      padding: 7px 14px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .lang-btn.active { background: #ef4444; border-color: #ef4444; }

    .cat-nav {
      background: #111c32;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #243656;
    }
    .cat-btn {
      padding: 8px 16px;
      border: 1px solid #3b82f6;
      background: #0b1324;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .wrap { max-width: 1080px; margin: 20px auto; padding: 0 15px; }

    .studio-grid {
      background: #0f172a;
      border: 1px solid #26354d;
      border-radius: 12px;
      padding: 18px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: start;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) {
      .studio-grid { grid-template-columns: 1fr; }
    }

    .video-box {
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }
    .video-header {
      background: #1e293b;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
    }
    .live-pill {
      background: #ef4444;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }
    video.anchor-video {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .fallback-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: none;
    }

    .news-details img.story-photo {
      width: 100%;
      max-height: 210px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #1e293b;
    }
    .news-title { font-size: 21px; color: #93c5fd; margin-bottom: 8px; }
    .news-desc { font-size: 15px; line-height: 1.6; color: #e2e8f0; margin-bottom: 14px; }
    .note-box {
      background: #131f38;
      border-left: 3px solid #38bdf8;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .list-title { font-size: 17px; margin-bottom: 12px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }
    .card-btn {
      background: #0f172a;
      border: 1px solid #26354d;
      border-radius: 10px;
      padding: 12px;
      color: #f8fafc;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-btn:hover, .card-btn.selected {
      border-color: #3b82f6;
      background: #16233d;
    }
    .card-btn img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      border-radius: 7px;
    }
    .card-title { font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🎬 VIDEO STUDIYA YANGILIKLARI</div>
    <div class="lang-btns">
      <button type="button" class="lang-btn active" id="l-uz" onclick="changeLang('uz')">O'zbek</button>
      <button type="button" class="lang-btn" id="l-en" onclick="changeLang('en')">English</button>
      <button type="button" class="lang-btn" id="l-ru" onclick="changeLang('ru')">Русский</button>
    </div>
  </header>

  <nav class="cat-nav" id="cat-nav"></nav>

  <main class="wrap">
    <section class="studio-grid">
      <div class="video-box">
        <div class="video-header">
          <span class="live-pill">STUDIO</span>
          <span id="anchor-role">Boshlovchi</span>
        </div>

        <video id="anchor-video" class="anchor-video" controls playsinline></video>
        <img id="fallback-img" class="fallback-img" src="" alt="Boshlovchi" />
      </div>

      <div class="news-details">
        <img id="story-photo" class="story-photo" src="" alt="Yangilik rasmi" />
        <h2 class="news-title" id="news-title"></h2>
        <p class="news-desc" id="news-desc"></p>
        <div class="note-box" id="note-box"></div>
      </div>
    </section>

    <h3 class="list-title" id="list-title">Yangiliklar:</h3>
    <div class="cards" id="cards"></div>
  </main>

  <script>

              videoUrl: ""
            }
          ],
          edu: [
            {
              title: "Dasturlash va sun'iy intellekt bo'yicha yangi dastur",
              desc: "Ta'lim yangiliklari: Talabalar va yoshlar uchun yangi amaliy o'quv dasturi boshlandi.",
              img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80",
              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",
              videoUrl: ""
            }
          ],
          world: [
            {
              title: "Xalqaro energetika va iqlim uchrashuvi",
              desc: "Dunyo yangiliklari: Davlatlar qayta tiklanuvchi energiya loyihalarini muhokama qilmoqda.",
              img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",

          ],
          other: [

      },
      en: {
        role: "English Studio Anchor",
        listTitle: "Category news (click):",
        note: "Set `videoUrl` to an `.mp4` link (for example `videos/en-sport-1.mp4`) to play a real studio anchor video.",
        cats: {
          sport: "Sport",
          edu: "Education",
          world: "World",
          other: "Other News"
        },
        items: {
          sport: [
            {
              title: "National team wins an important match",

              videoUrl: ""
            }
          ],

              img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",

            }

          other: [

            }
          ]
        }
      },
      ru: {
        role: "Ведущая студии",
        listTitle: "Новости раздела (нажмите):",
        note: "Укажите ссылку на `.mp4` файл в поле `videoUrl` (например: `videos/ru-sport-1.mp4`), чтобы запускалось видео ведущего.",
        cats: {
          sport: "Спорт",
          edu: "Образование",
          world: "Мир",
          other: "Другие новости"
        },
        items: {
          sport: [
            {
              title: "Сборная одержала важную победу",
              desc: "Новости спорта: Команда уверенно победила в важном матче.",

              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",
              videoUrl: ""
            }
          ],
          edu: [
            {
              title: "Новые программы обучения ИИ и коду",
              desc: "Новости образования: Для студентов открыты новые курсы.",
              img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80",
              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",
              videoUrl: ""
            }
          ],
          world: [
            {
              title: "Форум по энергетике и климату",
              desc: "Мировые новости: Участники обсудили зеленую энергетику.",
              img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",
              videoUrl: ""
            }
          ],
          other: [
            {
              title: "Новые космические наблюдения",
              desc: "Другие новости: Опубликованы новые снимки космоса.",
              img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=800&q=80",
              poster: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80",
              videoUrl: ""
            }
          ]
        }
      }
    };

    let lang = "uz";
    let cat = "sport";
    let idx = 0;

    function changeLang(newLang) {
      stopVideo();
      lang = newLang;
      cat = "sport";
      idx = 0;

      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("l-" + lang).classList.add("active");

      renderCats();
      renderCards();
      renderCurrent(false);
    }

    function renderCats() {
      const nav = document.getElementById("cat-nav");
      nav.innerHTML = "";
      const cats = DATA[lang].cats;

      Object.keys(cats).forEach(key => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (key === cat ? " active" : "");
        btn.textContent = cats[key];
        btn.onclick = () => {
          stopVideo();
          cat = key;
          idx = 0;
          renderCats();
          renderCards();
          renderCurrent(false);
        };
        nav.appendChild(btn);
      });
    }

    function renderCards() {
      const box = document.getElementById("cards");
      box.innerHTML = "";
      const list = DATA[lang].items[cat] || [];

      list.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card-btn" + (i === idx ? " selected" : "");
        btn.innerHTML = `
          <img src="${item.img}" alt="${item.title}" />
          <span class="card-title">${item.title}</span>
        `;
        btn.onclick = () => {
          idx = i;
          renderCards();
          renderCurrent(true);
        };
        box.appendChild(btn);
      });
    }

    function renderCurrent(autoPlay) {
      const pack = DATA[lang];
      const item = (pack.items[cat] || [])[idx] || { title: "", desc: "", img: "", poster: "", videoUrl: "" };

      document.getElementById("anchor-role").textContent = pack.role;
      document.getElementById("list-title").textContent = pack.listTitle;
      document.getElementById("note-box").textContent = pack.note;

      document.getElementById("story-photo").src = item.img;
      document.getElementById("news-title").textContent = item.title;
      document.getElementById("news-desc").textContent = item.desc;

      const videoEl = document.getElementById("anchor-video");
      const fallbackEl = document.getElementById("fallback-img");

      if (item.videoUrl) {
        fallbackEl.style.display = "none";
        videoEl.style.display = "block";
        videoEl.poster = item.poster || item.img;
        videoEl.src = item.videoUrl;
        if (autoPlay) {
          videoEl.play().catch(() => {});
        }
      } else {
        videoEl.pause();
        videoEl.removeAttribute("src");
        videoEl.style.display = "none";
        fallbackEl.style.display = "block";
        fallbackEl.src = item.poster || item.img;
      }
    }

    function stopVideo() {
      const videoEl = document.getElementById("anchor-video");
      videoEl.pause();
      videoEl.currentTime = 0;
    }

    changeLang("uz");
  </script>
</body>
</html>
