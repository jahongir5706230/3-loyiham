    header {
      background: #111827;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;

    .brand { font-size: 20px; font-weight: bold; }

    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {

      border: 1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-btn.active { background: #2563eb; border-color: #2563eb; }

    .cat-bar {
      background: #131c2e;
      padding: 13px 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      border-bottom: 1px solid #23324d;
    }
    .cat-btn {
      padding: 8px 14px;
      border: 1px solid #3b82f6;
      background: #0b1324;
      color: #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .container { max-width: 1180px; margin: 22px auto; padding: 0 16px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-title { font-size: 19px; font-weight: bold; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .source-select {
      background: #111827;
      color: #f8fafc;
      border: 1px solid #374151;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .count-badge { font-size: 13px; color: #94a3b8; }

    .schedule-wrap {
      background: #111827;
      border: 1px solid #26354d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    table.schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.schedule-table th, table.schedule-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    table.schedule-table th { color: #93c5fd; font-weight: 600; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .card {
      background: #111827;
      border: 1px solid #26354d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #1e293b;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #60a5fa;
      font-weight: 600;
    }
    .topic-tag {
      background: #1e293b;
      color: #e2e8f0;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .broadcast-box {
      background: #172554;
      border: 1px solid #3b82f6;
      color: #dbeafe;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
    .broadcast-box strong { color: #93c5fd; }
    .card-title { font-size: 17px; line-height: 1.38; color: #f8fafc; }
    .card-text { font-size: 14px; line-height: 1.55; color: #cbd5e1; flex: 1; }
    .card-link {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-top: 4px;
    }
    .card-link:hover { text-decoration: underline; }

    let currentCat = "sport";
    let currentStories = [];

    function setLang(lang) {
      currentLang = lang;
      currentCat = "sport";

      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("l-" + lang).classList.add("active");
      document.getElementById("brand-name").textContent = PORTAL[lang].brand;

      renderCategories();
      loadCategoryStories();
    }

    function renderCategories() {
      const bar = document.getElementById("cat-bar");
      bar.innerHTML = "";
      const cats = PORTAL[currentLang].categories;

      Object.keys(cats).forEach(key => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (key === currentCat ? " active" : "");
        btn.textContent = cats[key];
        btn.onclick = () => {
          currentCat = key;
          renderCategories();
          loadCategoryStories();
        };
        bar.appendChild(btn);
      });
    }

    function loadCategoryStories() {
      const pack = PORTAL[currentLang];
      document.getElementById("section-title").textContent = pack.categories[currentCat];
      currentStories = [...(pack.items[currentCat] || [])];
      populateSourceFilter();
      renderFilteredCards();
    }

    function populateSourceFilter() {
      const select = document.getElementById("source-select");
      const pack = PORTAL[currentLang];
      const sources = [...new Set(currentStories.map(item => item.source))];

      select.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "ALL";
      allOpt.textContent = pack.allSources;
      select.appendChild(allOpt);

      sources.forEach(src => {
        const opt = document.createElement("option");
        opt.value = src;
        opt.textContent = src;
        select.appendChild(opt);
      });
    }

    function renderScheduleTable(filtered) {
      const pack = PORTAL[currentLang];
      const wrap = document.getElementById("schedule-wrap");
      const table = document.getElementById("schedule-table");

      if (currentCat !== "match_times" || filtered.length === 0) {
        wrap.style.display = "none";
        table.innerHTML = "";
        return;
      }

      wrap.style.display = "block";
      const rows = filtered.map(item => `
        <tr>
          <td>${item.matchName || item.title}</td>
          <td>${item.tvTime || "-"}</td>
          <td>${item.channel || "-"}</td>
        </tr>
      `).join("");

      table.innerHTML = `
        <thead>
          <tr>
            <th>${pack.thMatch}</th>
            <th>${pack.thTime}</th>
            <th>${pack.thChannel}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      `;
    }

    function renderFilteredCards() {
      const pack = PORTAL[currentLang];
      const selectedSource = document.getElementById("source-select").value;
      const filtered = selectedSource === "ALL"
        ? currentStories
        : currentStories.filter(item => item.source === selectedSource);

      document.getElementById("count-badge").textContent = `${filtered.length} ${pack.countLabel}`;
      renderScheduleTable(filtered);

      const grid = document.getElementById("news-grid");
      grid.innerHTML = "";

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        const broadcastHtml = (item.tvTime || item.channel)
          ? `<div class="broadcast-box">
               ${item.tvTime ? `<div><strong>${pack.timeLabel}:</strong> ${item.tvTime}</div>` : ""}
               ${item.channel ? `<div><strong>${pack.channelLabel}:</strong> ${item.channel}</div>` : ""}
             </div>`
          : "";

        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}" />
          <div class="card-body">
            <div class="card-top">
              <span>${item.source}</span>
              <span class="topic-tag">${item.subtopic || ""}</span>
            </div>
            ${broadcastHtml}
            <h3 class="card-title">${item.title}</h3>
            <p class="card-text">${item.text}</p>
            <a class="card-link" href="${item.url}" target="_blank" rel="noopener noreferrer">${pack.readMore}</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    setLang("uz");
  </script>
</body>
</html>
