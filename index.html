<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangiliklar</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .langs, .cats { display: flex; gap: 8px; flex-wrap: wrap; }
    .cats { background: #172033; padding: 12px 18px; justify-content: center; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; cursor: pointer; font-weight: bold; }
    button.active { background: #2563eb; border-color: #2563eb; }
    .wrap { max-width: 1000px; margin: 20px auto; padding: 0 14px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    input { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card h3 { margin: 6px 0 8px; font-size: 16px; }
    .card p { margin: 0 0 10px; font-size: 14px; color: #cbd5e1; line-height: 1.45; }
    .meta { font-size: 12px; color: #93c5fd; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; padding: 14px; }
    .modal.open { display: flex; }
    .box { background: #1e293b; border: 1px solid #475569; border-radius: 10px; max-width: 600px; width: 100%; padding: 18px; }
  </style>
</head>
<body>
  <header>
    <strong id="title-brand">YANGILIKLAR</strong>
    <div class="langs">
      <button type="button" id="b-uz" class="active" onclick="switchLang('uz')">O'zbek</button>
      <button type="button" id="b-en" onclick="switchLang('en')">English</button>
      <button type="button" id="b-ru" onclick="switchLang('ru')">Русский</button>
    </div>
  </header>

  <nav class="cats" id="cat-list"></nav>

  <div class="wrap">
    <div class="top">
      <h2 id="cat-title" style="margin:0;">Sport</h2>
      <input type="search" id="search-box" oninput="showCards()" placeholder="Qidirish..." />
    </div>
    <div class="grid" id="cards-grid"></div>
  </div>

  <div class="modal" id="modal" onclick="if(event.target.id==='modal')closeBox()">
    <div class="box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span class="meta" id="m-meta"></span>
        <button type="button" onclick="closeBox()">X</button>
      </div>
      <h3 id="m-title" style="margin:0 0 10px;"></h3>
      <p id="m-text" style="line-height:1.6; color:#e2e8f0; white-space:pre-line;"></p>
    </div>
  </div>

  <script>
    const DATA = {
      uz: {
        brand: "YANGILIKLAR",
        read: "Saytda o'qish",
        cats: {
          sport: "Sport",
          times: "O'yinlar vaqti",
          edu: "Ta'lim",
          world: "Dunyo",
          america: "Amerika",
          russia: "Rossiya",
          uzbekistan: "O'zbekiston",
          other: "Boshqa yangiliklar"
        },
        news: {
          sport: [
            { meta: "Futbol klublari", title: "Yevropa klublari o'yinlari", short: "Top klublar chempionat va xalqaro turlarga tayyorlanmoqda.", full: "Yevropa futbol klublari ichki chempionat va xalqaro musobaqalardagi uchrashuvlarga tayyorgarlik ko'rmoqda." },
            { meta: "Basketbol", title: "Basketbol klublari bahslari", short: "Jamoalar muntazam uchrashuvlarda ochkolar uchun kurashmoqda.", full: "Basketbol klublari konferensiya jadvalidagi o'rinlar uchun ketma-ket uchrashuvlar o'tkazmoqda." }
          ],
          times: [
            { meta: "2026-11-28, 01:00 (+05) • Sport TV / Futbol TV jadvalini tekshiring", title: "Nottingham Forest — Chelsea", short: "Uchrashuv 28-noyabr, 01:00 (+05) da rejalashtirilgan.", full: "O'yin: Nottingham Forest — Chelsea\nSoat: 2026-11-28, 01:00 (+05)\nKanal: Sport TV / Futbol TV efir dasturini tekshiring." }
          ],
          edu: [
            { meta: "Ta'lim", title: "Universitetlarda o'quv dasturlari", short: "Amaliy va raqamli kurslar kengaytirilmoqda.", full: "Oliy o'quv yurtlarida amaliy mashg'ulotlar va raqamli dasturlar rivojlantirilmoqda." }
          ],
          world: [
            { meta: "Dunyo", title: "Xalqaro uchrashuvlar", short: "Savdo va energetika masalalari muhokama qilinmoqda.", full: "Davlatlar o'rtasida savdo yo'laklari va energetika hamkorligi muhokama etilmoqda." }
          ],
          america: [
            { meta: "Amerika", title: "Amerika yangiliklari", short: "Texnologiya, iqtisodiyot va infratuzilma yangiliklari.", full: "AQSh va Amerika mintaqasidagi iqtisodiy va texnologik jarayonlar yoritilmoqda." }
          ],
          russia: [
            { meta: "Rossiya", title: "Rossiya yangiliklari", short: "Iqtisodiyot, transport va hududiy loyihalar.", full: "Rossiyadagi transport, sanoat va iqtisodiy yangiliklar." }
          ],
          uzbekistan: [
            { meta: "O'zbekiston", title: "O'zbekiston yangiliklari", short: "Infratuzilma, ta'lim va raqamli xizmatlar.", full: "O'zbekistonda infratuzilma, iqtisodiyot va ijtimoiy loyihalar amalga oshirilmoqda." }
          ],
          other: [
            { meta: "Boshqa yangiliklar", title: "Ilm-fan va texnologiya", short: "Yangi tadqiqot va ishlanma ma'lumotlari.", full: "Ilmiy va texnologik yo'nalishdagi yangi tadqiqot natijalari." }
          ]
        }
      },
      en: {
        brand: "NEWS",
        read: "Read on site",
        cats: { sport: "Sport", times: "Game Times", edu: "Education", world: "World", america: "America", russia: "Russia", uzbekistan: "Uzbekistan", other: "Other News" },
        news: {
          sport: [{ meta: "Football Clubs", title: "European club fixtures", short: "Top clubs prepare for league and international matches.", full: "European football clubs continue domestic league and international fixtures." }],
          times: [{ meta: "2026-11-28, 01:00 (+05) • Check Sport TV / Futbol TV guide", title: "Nottingham Forest — Chelsea", short: "Kickoff: Nov 28, 2026 at 01:00 (+05).", full: "Match: Nottingham Forest — Chelsea\nTime: 2026-11-28, 01:00 (+05)\nChannel: Check broadcast schedule." }],
          edu: [{ meta: "Education", title: "University digital programs", short: "Practical and digital courses expand.", full: "Universities expand digital and practical learning programs." }],
          world: [{ meta: "World", title: "Global trade and talks", short: "International discussions on trade and energy.", full: "Global talks cover trade corridors, energy, and diplomacy." }],
          america: [{ meta: "America", title: "Americas update", short: "Tech, industry, and trade news.", full: "Key developments across the Americas." }],
          russia: [{ meta: "Russia", title: "Russia update", short: "Economy, transport, and regional news.", full: "Key updates on economy and transport in Russia." }],
          uzbekistan: [{ meta: "Uzbekistan", title: "Uzbekistan update", short: "Infrastructure and digital services.", full: "Updates on infrastructure and digital services in Uzbekistan." }],
          other: [{ meta: "Other News", title: "Science and tech", short: "New research and technical updates.", full: "Recent research updates and technical developments." }]
        }
      },
      ru: {
        brand: "НОВОСТИ",
        read: "Читать на сайте",
        cats: { sport: "Спорт", times: "Время игр", edu: "Образование", world: "Мир", america: "Америка", russia: "Россия", uzbekistan: "Узбекистан", other: "Другие новости" },
        news: {
          sport: [{ meta: "Футбольные клубы", title: "Матчи европейских клубов", short: "Клубы готовятся к матчам чемпионатов и турниров.", full: "Футбольные клубы проводят матчи в чемпионатах и турнирах." }],
          times: [{ meta: "2026-11-28, 01:00 (+05) • Проверьте программу Sport TV / Futbol TV", title: "Ноттингем Форест — Челси", short: "Начало: 28 ноября, 01:00 (+05).", full: "Матч: Ноттингем Форест — Челси\nВремя: 2026-11-28, 01:00 (+05)\nКанал: уточняйте по программе эфира." }],
          edu: [{ meta: "Образование", title: "Образовательные программы", short: "Развитие цифровых курсов и обучения.", full: "Развитие цифровых и практических программ обучения." }],
          world: [{ meta: "Мир", title: "Международные новости", short: "Вопросы торговли, энергетики и сотрудничества.", full: "Международные встречи по вопросам торговли и энергетики." }],
          america: [{ meta: "Америка", title: "Новости Америки", short: "Экономика и технологии региона.", full: "События в сфере технологий и экономики Америки." }],
          russia: [{ meta: "Россия", title: "Новости России", short: "Экономика, транспорт и регионы.", full: "Ключевые события в экономике и транспорте России." }],
          uzbekistan: [{ meta: "Узбекистан", title: "Новости Узбекистана", short: "Инфраструктура и цифровые услуги.", full: "Новости инфраструктуры и цифровых услуг Узбекистана." }],
          other: [{ meta: "Другие новости", title: "Наука и технологии", short: "Новые данные научных исследований.", full: "Новые данные научных и технологических исследований." }]
        }
      }
    };

    let curLang = "uz", curCat = "sport", curList = [];

    function switchLang(l) {
      curLang = l;
      curCat = "sport";
      document.querySelectorAll(".langs button").forEach(b => b.classList.remove("active"));
      document.getElementById("b-" + l).classList.add("active");
      document.getElementById("title-brand").textContent = DATA[l].brand;
      renderCats();
      showCards();
    }

    function renderCats() {
      const box = document.getElementById("cat-list");
      box.innerHTML = "";
      const cats = DATA[curLang].cats;
      Object.keys(cats).forEach(k => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cats[k];
        if (k === curCat) btn.classList.add("active");
        btn.onclick = () => { curCat = k; renderCats(); showCards(); };
        box.appendChild(btn);
      });
    }

    function showCards() {
      const pack = DATA[curLang];
      document.getElementById("cat-title").textContent = pack.cats[curCat];
      const q = document.getElementById("search-box").value.trim().toLowerCase();
      curList = (pack.news[curCat] || []).filter(item => !q || (item.title + " " + item.short + " " + item.full + " " + item.meta).toLowerCase().includes(q));
      const grid = document.getElementById("cards-grid");
      grid.innerHTML = "";
      curList.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<div class="meta">${item.meta}</div><h3>${item.title}</h3><p>${item.short}</p><button type="button" onclick="openBox(${i})">${pack.read}</button>`;
        grid.appendChild(div);
      });
    }

    function openBox(i) {
      const item = curList[i];
      if (!item) return;
      document.getElementById("m-meta").textContent = item.meta;
      document.getElementById("m-title").textContent = item.title;
      document.getElementById("m-text").textContent = item.full;
      document.getElementById("modal").classList.add("open");
    }

    function closeBox() {
      document.getElementById("modal").classList.remove("open");
    }

    switchLang("uz");
  </script>
</body>
</html>
